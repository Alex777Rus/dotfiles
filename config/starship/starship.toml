format = """
$directory$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold red)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold #ffffff"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = " "
style = "dimmed white"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
format = "[ $duration](dimmed red) "
